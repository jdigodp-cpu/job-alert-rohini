# Example configuration for Rohini's daily job alert system.
# Copy this file to config.yaml and edit as needed.
# PyYAML is optional: if it is not installed, defaults + environment
# variables (JOBALERT_*) are used instead.

sources:
  demo:
    enabled: false        # set true to test with built-in sample jobs
  rapidapi:
    enabled: true         # real job aggregation via RapidAPI (JSearch)
    api_key: ""           # set via JOBALERT_SOURCES__RAPIDAPI__API_KEY env var / GitHub secret
    engine: "jsearch"     # "jsearch" (LinkedIn/Indeed/Glassdoor agg.) or "techmap"
    country: "in"         # India-focused results (you're in Pune); set "" for global
  blocked_domains:
    - "bebee.com"         # paywalled job board — skip entirely
  allowed_domains:
    - "linkedin.com"      # only LinkedIn jobs
    - "indeed.com"        # only Indeed jobs
    - "naukri.com"        # only Naukri jobs

search_queries:
  - "Dynamics 365 Developer"
  - "Power Platform Developer"
  - "Power Apps Developer"
  - "Power Automate Developer"
  - "D365 CRM Developer"
  - "Microsoft Dynamics 365"
  - "CRM Developer"
  - "PL-400"
  - "Dynamics CRM"
  - "Power Platform Consultant"

preferred_locations:
  - "Pune"
  - "India"
  - "Remote"
  - "Work from home"
  - "WFH"

experience_years: "3+"

scoring:
  skill_weight: 0.5
  title_weight: 0.3
  location_weight: 0.15
  recency_weight: 0.05
  relevant_threshold: 0.60   # score >= this => immediate alert
  maybe_threshold: 0.40      # score >= this => daily digest

notifications:
  console: true
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    smtp_user: ""
    smtp_pass: ""
    to: ""
  windows_toast: true
  telegram:
    enabled: false
    bot_token: ""       # get from @BotFather on Telegram
    chat_id: ""         # your chat id (or a group/chat id)
